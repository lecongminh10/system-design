services:
  app-1:
    build: ./app
    environment:
      INSTANCE_NAME: app-1
      PORT: 3000
    expose:
      - "3000"

  app-2:
    build: ./app
    environment:
      INSTANCE_NAME: app-2
      PORT: 3000
    expose:
      - "3000"

  app-3:
    build: ./app
    environment:
      INSTANCE_NAME: app-3
      PORT: 3000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app-1
      - app-2
      - app-3
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
