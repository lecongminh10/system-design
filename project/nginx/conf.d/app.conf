# Lesson 01 & 02: Reverse Proxy & Load Balancer Upstream Configuration

upstream backend_cluster {
    # Round-Robin Load Balancing across 3 App Instances
    server app-1:3000 max_fails=3 fail_timeout=10s;
    server app-2:3000 max_fails=3 fail_timeout=10s;
    server app-3:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Reverse Proxy Header Forwarding
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://backend_cluster;
        
        # Enable HTTP 1.1 keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://backend_cluster/health;
    }
}
